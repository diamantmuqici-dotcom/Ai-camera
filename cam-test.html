<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel AI Camera — Capability Lab</title><style>body{margin:0;background:#050609;color:#eef2f7;font:14px system-ui;padding:18px;line-height:1.45}button{padding:12px 16px;border:1px solid #333;border-radius:12px;background:#151923;color:#fff;font-weight:700;margin:4px}pre{white-space:pre-wrap;word-break:break-word;background:#0b0d12;border:1px solid #20242d;border-radius:14px;padding:14px;font:12px ui-monospace,monospace}.ok{color:#6ee7a0}.warn{color:#ffd166}.err{color:#ff7b7b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.card{background:#0b0d12;border:1px solid #20242d;border-radius:14px;padding:12px}video{width:100%;max-height:48vh;background:#000;border-radius:14px}</style></head><body><h1>PIXEL CAMERA LAB</h1><p>Exact browser-exposed capabilities. Nothing is inferred as hardware support unless the API reports it.</p><button id="start">REQUEST CAMERA</button><button id="copy">COPY JSON</button><button id="stop">STOP</button><div class="grid"><div class="card" id="summary">Not started.</div><div class="card"><video id="video" autoplay playsinline muted></video></div></div><pre id="out"></pre><script src="./core/camera-capabilities.js"></script><script src="./core/device-profile.js"></script><script src="./diagnostics/camera-diagnostics.js"></script><script src="./diagnostics/capability-report.js"></script><script>let stream=null,report={};const $=id=>document.getElementById(id);const show=x=>{$("out").textContent=JSON.stringify(x,null,2)};$("start").onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:60}},audio:false});$("video").srcObject=stream;await $("video").play().catch(()=>{});const track=stream.getVideoTracks()[0],r=CapabilityReport.build(track),devices=await CameraDiagnostics.enumerate();report={secureContext:isSecureContext,deviceProfile:DeviceProfile.summary(),track:r,videoInputs:devices,apis:{getUserMedia:!!navigator.mediaDevices?.getUserMedia,mediaRecorder:typeof MediaRecorder==="function",imageCapture:"ImageCapture"in window,webGPU:!!navigator.gpu,webAssembly:typeof WebAssembly==="object",offscreenCanvas:"OffscreenCanvas"in window,workers:typeof Worker==="function",indexedDB:"indexedDB"in window}};$("summary").innerHTML='<b class="ok">CAMERA READY</b><br>'+JSON.stringify(r.camera)+'<br><br><b>Inputs:</b> '+devices.length;show(report)}catch(e){$("summary").innerHTML='<b class="err">'+e.name+'</b><br>'+e.message;show({error:e.name,message:e.message})}};$("stop").onclick=()=>{stream?.getTracks().forEach(t=>t.stop());stream=null;$("video").srcObject=null};$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(report,null,2));$("summary").innerHTML+='<br><b class="ok">COPIED</b>'}catch{}};</script></body></html>
