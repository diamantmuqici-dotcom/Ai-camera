<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Probe</title>
<style>
  body{background:#000;color:#fff;font-family:monospace;padding:16px}
  #log{white-space:pre-wrap;font-size:13px;line-height:1.7;margin:12px 0}
  button{font-size:18px;padding:14px 24px;border-radius:12px;border:none;
    background:#5ab0ff;color:#00203a;font-weight:700}
  video{width:100%;max-height:55vh;background:#111;margin-top:10px;border-radius:10px}
  .ok{color:#5ee08c}.err{color:#ff6b6b}.warn{color:#ffcf5c}
</style>
</head>
<body>
<h2>CAMERA PROBE</h2>
<button id="btn">TAP TO TEST CAMERA</button>
<div id="log"></div>
<video id="v" autoplay playsinline muted></video>
<script>
const L=(m,c)=>{const d=document.createElement("div");d.textContent=m;
  if(c)d.className=c;document.getElementById("log").appendChild(d);};
window.addEventListener("error",e=>L("SCRIPT ERROR: "+e.message,"err"));
L("isSecureContext: "+window.isSecureContext, window.isSecureContext?"ok":"warn");
L("protocol: "+location.protocol);
L("mediaDevices: "+!!navigator.mediaDevices, navigator.mediaDevices?"ok":"err");
L("getUserMedia: "+!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia));
document.getElementById("btn").onclick=async()=>{
  L("requesting camera...");
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:true});
    const t=s.getVideoTracks()[0];
    L("SUCCESS: "+(t.label||"camera"),"ok");
    try{L("settings: "+JSON.stringify(t.getSettings()),"ok");}catch(e){}
    document.getElementById("v").srcObject=s;
  }catch(e){
    L("FAILED: "+e.name+" — "+e.message,"err");
    const h={NotAllowedError:"Permission denied OR insecure origin. Tap the camera/lock icon in the address bar → Permissions → allow Camera.",
      NotFoundError:"No camera detected.",
      NotReadableError:"Camera is busy in another app — close it.",
      SecurityError:"Blocked: needs HTTPS or localhost.",
      OverconstrainedError:"Constraints unsupported."};
    if(h[e.name])L(h[e.name],"warn");
  }
};
</script>
</body>
</html>
