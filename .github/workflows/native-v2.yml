name: Build ClarityCam V2 native apps

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android APK + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check or install Android 35 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Test and assemble debug APK
        working-directory: android
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/clarity-android-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            detail=$(tail -n 65 /tmp/clarity-android-build.log | tr '\n' ' ' | cut -c 1-12000)
            echo "::error title=Android build failed::$detail"
            exit "$result"
          fi
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ClarityCam-V2-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows EXE + unit/UI tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install -r desktop/requirements.txt
          python -m pip install pyinstaller==6.16.0 'pillow>=11,<12'
        shell: bash
      - name: Install offline OCR runtime
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $ocr = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (-not (Test-Path (Join-Path $ocr 'tesseract.exe'))) { throw 'Tesseract binary was not installed' }
          if (-not (Test-Path (Join-Path $ocr 'tessdata/eng.traineddata'))) { throw 'English OCR model was not installed' }
          Write-Host "Bundling on-device OCR from $ocr"
      - name: Run deterministic and headless UI tests
        working-directory: desktop
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath test-output.log
          if ($LASTEXITCODE -ne 0) {
            $detail = (Get-Content test-output.log -Raw)
            $detail = $detail.Substring(0, [Math]::Min(12000, $detail.Length)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Desktop test failure::$detail"
            exit 1
          }
      - name: Package portable native EXE and OCR files
        shell: pwsh
        run: |
          function Report-Failure([string]$message) {
            $detail = $message.Substring([Math]::Max(0, $message.Length - 10000)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows packaging failed::$detail"
            exit 1
          }
          try {
            python desktop/tools/make_icon.py 2>&1 | Tee-Object -FilePath desktop/package-output.log
            if ($LASTEXITCODE -ne 0) { Report-Failure ((Get-Content desktop/package-output.log -Raw)) }
            $ocr = Join-Path $env:ProgramFiles 'Tesseract-OCR'
            $icon = (Resolve-Path 'desktop/assets/clarity.ico').Path
            pyinstaller --noconfirm --clean --onedir --windowed --name ClarityCam `
              --icon "$icon" --add-data "$ocr;tesseract" desktop/run.py `
              --distpath desktop/dist --workpath desktop/build --specpath desktop 2>&1 | Tee-Object -FilePath desktop/package-output.log -Append
            if ($LASTEXITCODE -ne 0) { Report-Failure ((Get-Content desktop/package-output.log -Tail 28) -join "`n") }
            if (-not (Test-Path 'desktop/dist/ClarityCam/ClarityCam.exe')) { Report-Failure 'EXE was not produced' }
            Compress-Archive -Path 'desktop/dist/ClarityCam/*' -DestinationPath 'desktop/ClarityCam-V2-Windows.zip' -Force
            if (-not (Test-Path 'desktop/ClarityCam-V2-Windows.zip')) { Report-Failure 'Portable zip was not produced' }
          } catch { Report-Failure $_.Exception.Message }
      - name: Smoke-test bundled EXE and offline OCR
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:CLARITY_SMOKE_LOG = Join-Path (Resolve-Path desktop).Path 'smoke.log'
          $proc = Start-Process -FilePath 'desktop/dist/ClarityCam/ClarityCam.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $proc.WaitForExit(40000)) {
            $proc.Kill()
            Write-Output '::error title=Packaged app smoke test::EXE timed out before drawing a window'
            exit 1
          }
          if ($proc.ExitCode -ne 0) {
            $detail = if (Test-Path $env:CLARITY_SMOKE_LOG) { Get-Content $env:CLARITY_SMOKE_LOG -Raw } else { "EXE exited with code $($proc.ExitCode) before writing diagnostics" }
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Packaged app smoke test::$detail"
            exit 1
          }
      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ClarityCam-V2-Windows-EXE
          path: desktop/ClarityCam-V2-Windows.zip
          if-no-files-found: error
          compression-level: 0
